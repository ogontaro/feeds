  # リンク（news.google.com のリダイレクト URL）は translate 時に元記事 URL へ解決する（feeds.ts）。
  - url: https://news.google.com/rss/search?q=%28Kubernetes%20OR%20CNCF%29%20%28launch%20OR%20release%20OR%20graduates%20OR%20vulnerability%20OR%20CVE%29%20when%3A2d&hl=en-US&gl=US&ceid=US:en
    id: gnews-kubernetes
    name: Google News — Kubernetes
    domain: kubernetes
    kind: content

