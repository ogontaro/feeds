# 購読フィードの正。ドメイン（claude / kubernetes / aws / devtools）× 種別（content / release）で管理する。
#   content … 翻訳フィードと日次レポートの入力
#   release … 週次のリリースレポートの入力
# 趣味・個人的なフィード、キーや userId を URL に含むフィードは入れない（公開前提）。
feeds:
  # ================= claude / content =================
  - url: https://simonwillison.net/tags/claude.atom
    id: simon-claude
    name: Simon Willison — Claude
    domain: claude
    kind: content
  - url: https://dev.classmethod.jp/tags/claude/feed/
    name: Claude | DevelopersIO
    domain: claude
    kind: content
  - url: https://dev.classmethod.jp/tags/anthropic/feed/
    name: Anthropic | DevelopersIO
    domain: claude
    kind: content
  - url: https://claude-code-log.com/rss.xml
    name: CCログ超訳（Claude Code CHANGELOG）
    domain: claude
    kind: content

  # ----- AI 全般（Claude に限らない実務寄りの話題）-----
  - url: https://developersblog.dmm.com/rss/category/AI
    name: AI - DMM Developers Blog
    domain: claude
    kind: content
  - url: https://addyosmani.com/rss.xml
    id: addyosmani
    name: AddyOsmani.com
    domain: claude
    kind: content
  - url: https://blog.3-shake.com/feed.xml
    name: 3-shake Engineers' Blogs
    domain: claude
    kind: content

  # ----- AI業界のトレンド・考え方（製品公式ブログでは拾えない話題）-----
  - url: https://latent.space/feed
    id: latent-space
    name: Latent Space
    domain: claude
    kind: content
  # GitHub Actions のランナー IP から一貫して 403（手元からは 200）。--strict の
  # translate.yml を毎回落としていたため無効化（issue #3-8）。
  - url: https://importai.substack.com/feed
    id: importai
    name: Import AI
    domain: claude
    kind: content
    enabled: false
  - url: https://ainow.ai/feed/
    name: AINOW
    domain: claude
    kind: content

  # ----- 新しいコーディングエージェント系ツールの発見源 -----
  # commits.atom（リポジトリ全体）は ticker bot の自動コミットで埋まりノイズだらけなので、
  # README.md への変更だけに絞った path 指定の commits atom を使う（新規ツール追加のみ拾える）。
  # ただし ticker bot が README.md 自体を毎回書き換えるため ticker コミットしか流れず、
  # 採用実績ゼロ。発見源は AI Devtools Radar / はてブ検索で代替し無効化。
  - url: https://github.com/hesreallyhim/awesome-claude-code/commits/main.atom?path=README.md
    id: awesome-claude-code
    name: awesome-claude-code updates
    domain: claude
    kind: content
    enabled: false
  # タグ claude-code は 2026-09-07 以降更新が止まっている。活きているのは claudecode タグ。
  - url: https://qiita.com/tags/claudecode/feed
    name: Qiita — Claude Code
    domain: claude
    kind: content
  # AI コーディングツールの新機能・料金変更の週刊まとめ。
  - url: https://buttondown.com/devtoolsradar/rss
    id: devtools-radar
    name: AI Devtools Radar
    domain: claude
    kind: content

  # ----- トレンド（しきい値で事前フィルタ済み）-----
  # しきい値を超えてからフィードに載るため、元記事の pubDate で切る 24h 窓に入る量は少ない。
  # --strict の translate.yml は 502 1 件で落ちる（hn-kubernetes/hn-aws の前例）。続くなら無効化。
  - url: https://hnrss.org/frontpage?points=300
    id: hn-frontpage
    name: HN — Front page (300+)
    domain: claude
    kind: content
  # 新しいコーディングエージェント系サービスの発表・料金変更を当日拾う（Meta Muse Code は
  # HN にも購読中ブログにも出ず、ニュース媒体だけが報じた）。リンクは gnews-kubernetes と同様に解決する。
  - url: https://news.google.com/rss/search?q=%28%22coding%20agent%22%20OR%20%22AI%20coding%20agent%22%20OR%20%22AI%20coding%20assistant%22%29%20%28launch%20OR%20launches%20OR%20pricing%20OR%20subscription%20OR%20%22per%20month%22%29%20when%3A2d&hl=en-US&gl=US&ceid=US:en
    id: gnews-coding-agents
    name: Google News — コーディングエージェント新サービス・料金
    domain: claude
    kind: content
  # 日本語なので翻訳フィードは作らない（urls.ts の JA_SOURCE_HOSTS に b.hatena.ne.jp）。
  - url: https://b.hatena.ne.jp/q/Claude%20Code?mode=rss&users=50&sort=recent
    name: はてなブックマーク — Claude Code (50users+)
    domain: claude
    kind: content

