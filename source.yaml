  - url: https://github.blog/changelog/label/copilot/feed/
    name: GitHub Changelog — Copilot
    domain: claude
    kind: content
  # コーディングエージェント系サービスの新規発表・料金変更を報じる業界媒体。gnews-coding-agents は
  # 見出しのキーワード検索の網なので、開発ツール・エンタープライズ技術に強い媒体の AI/ML 面を直接購読する
  # （2026-09 の Meta Muse Code GA と $5/月 の料金体系は購読中フィードに一切出ず、報道媒体だけが報じた）。
  - url: https://www.theregister.com/software/ai_ml/headlines.atom
    name: The Register — AI/ML
    domain: claude
    kind: content
    addedAt: "2026-09-27"
  # 同じ狙い（コーディングエージェント系の新機能・料金変更を当日拾う）で、開発ツール・クラウド
  # ネイティブ領域に強い媒体の AI 面を直接購読する。thenewstack.io は platform-engineering 面を
  # 購読中で取得実績がある。
  - url: https://thenewstack.io/ai/feed/
    name: The New Stack — AI
    domain: claude
    kind: content
    addedAt: "2026-09-29"
