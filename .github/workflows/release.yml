name: release

on:
  schedule:
    - cron: "30 22 * * 0" # 毎週月曜 07:30 JST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      # ---------------- claude ----------------
      - id: collect_claude
        run: |
          bun run src/release-collect.ts claude
          echo "n=$(jq length .cache/release-claude-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate claude releases
        if: steps.collect_claude.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/release-claude-input.json,
            ${{ github.workspace }}/report-criteria/release-claude.md, and the "claude" section of
            ${{ github.workspace }}/interests.yaml for context on what matters most. Follow the
            criteria file: summarize the releases and write to
            ${{ github.workspace }}/.cache/release-claude.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: render claude releases
        if: steps.collect_claude.outputs.n != '0'
        run: bun run src/release-render.ts claude

      # ---------------- aws ----------------
      - id: collect_aws
        run: |
          bun run src/release-collect.ts aws
          echo "n=$(jq length .cache/release-aws-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate aws releases
        if: steps.collect_aws.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/release-aws-input.json,
            ${{ github.workspace }}/report-criteria/release-aws.md, and the "aws" section of
            ${{ github.workspace }}/interests.yaml for context on what matters most. Follow the
            criteria file: summarize the releases and write to
            ${{ github.workspace }}/.cache/release-aws.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: render aws releases
        if: steps.collect_aws.outputs.n != '0'
        run: bun run src/release-render.ts aws

      # ---------------- kubernetes ----------------
      - id: collect_kubernetes
        run: |
          bun run src/release-collect.ts kubernetes
          echo "n=$(jq length .cache/release-kubernetes-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate kubernetes releases
        if: steps.collect_kubernetes.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/release-kubernetes-input.json,
            ${{ github.workspace }}/report-criteria/release-kubernetes.md, and the "kubernetes"
            section of ${{ github.workspace }}/interests.yaml for context on what matters most.
            Follow the criteria file: summarize the releases and write to
            ${{ github.workspace }}/.cache/release-kubernetes.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: render kubernetes releases
        if: steps.collect_kubernetes.outputs.n != '0'
        run: bun run src/release-render.ts kubernetes

      - run: bun run src/build.ts

      - name: commit docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs adoption-log.ndjson
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "release: weekly update"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
