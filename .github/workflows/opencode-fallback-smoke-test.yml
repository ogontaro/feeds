name: opencode-fallback-smoke-test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: primary (intentionally broken model)
        id: primary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Write the text "primary-should-not-run" (nothing else) to
            ${{ github.workspace }}/.cache/fallback-smoke-test.txt. Write only that one file.
          claude_args: "--allowedTools Write --model this-model-does-not-exist[1m]"

      - name: fallback (qwen)
        if: steps.primary.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Write the text "fallback-ok" (nothing else) to
            ${{ github.workspace }}/.cache/fallback-smoke-test.txt. Write only that one file.
          claude_args: "--allowedTools Write --model qwen3.8-flash[1m]"

      - name: check result
        run: |
          test -f .cache/fallback-smoke-test.txt
          cat .cache/fallback-smoke-test.txt
          grep -qx "fallback-ok" .cache/fallback-smoke-test.txt
