name: issue-request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  handle:
    if: |
      !contains(github.event.issue.labels.*.name, 'component-review') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: reflect request with claude
        id: reflect_request
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            An issue was opened requesting a change to this RSS aggregation project.
            Issue title: ${{ github.event.issue.title }}
            Issue body: ${{ github.event.issue.body }}

            Read ${{ github.workspace }}/source.yaml and ${{ github.workspace }}/interests.yaml.
            If the request asks to add/remove a feed, or add/remove interest keywords, apply it:
            - Adding a feed: fetch the URL to confirm it serves RSS/Atom XML, then append it to
              source.yaml under the right domain/kind section with `addedAt: "<today, YYYY-MM-DD>"`.
            - Removing/disabling a feed: set `enabled: false` (do not delete the entry).
            - Adding/removing interest keywords: edit interests.yaml under the right domain.
            If the request is unclear or unrelated to feeds/keywords, do not modify any file.
            Write only source.yaml and/or interests.yaml, editing entries in place and preserving
            existing comments and structure — do not rewrite the whole file.
          claude_args: "--allowedTools Read,Write,WebFetch --model deepseek-v4.1-flash[1m]"

      - name: reflect request with claude (qwen fallback)
        if: steps.reflect_request.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            An issue was opened requesting a change to this RSS aggregation project.
            Issue title: ${{ github.event.issue.title }}
            Issue body: ${{ github.event.issue.body }}

            Read ${{ github.workspace }}/source.yaml and ${{ github.workspace }}/interests.yaml.
            If the request asks to add/remove a feed, or add/remove interest keywords, apply it:
            - Adding a feed: fetch the URL to confirm it serves RSS/Atom XML, then append it to
              source.yaml under the right domain/kind section with `addedAt: "<today, YYYY-MM-DD>"`.
            - Removing/disabling a feed: set `enabled: false` (do not delete the entry).
            - Adding/removing interest keywords: edit interests.yaml under the right domain.
            If the request is unclear or unrelated to feeds/keywords, do not modify any file.
            Write only source.yaml and/or interests.yaml, editing entries in place and preserving
            existing comments and structure — do not rewrite the whole file.
          claude_args: "--allowedTools Read,Write,WebFetch --model qwen3.8-flash[1m]"

      - name: validate newly added feeds
        run: bun run src/feed-audit-validate.ts

      - name: open and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.yaml interests.yaml
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "変更内容を自動で判定できなかったため、今回は反映していません。手動で対応してください。"
            exit 0
          fi
          SUMMARY=$(bun run src/feed-audit-summarize.ts)
          BRANCH="issue-request/${{ github.event.issue.number }}"
          git checkout -b "${BRANCH}"
          git commit -m "chore: reflect issue #${{ github.event.issue.number }} request"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          PR_URL=$(gh pr create --title "chore: reflect issue #${{ github.event.issue.number }}" \
            --body "Closes #${{ github.event.issue.number }}

          ${SUMMARY}" \
            --base main --head "${BRANCH}")
          gh pr merge --auto --squash "${PR_URL}"

  notify-failure:
    needs: handle
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          - Source issue: #${{ github.event.issue.number }}
          EOF
          )"
