name: trend

on:
  schedule:
    - cron: "45 22 1 * *" # 毎月2日 07:45 JST(前月ぶん)
  workflow_dispatch:
    inputs:
      month:
        description: "対象月 YYYY-MM(省略時は JST の前月)"
        required: false

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - id: collect
        env:
          MONTH: ${{ inputs.month }}
        run: |
          bun run src/digest/trend-collect.ts $MONTH
          echo "ok=$(test -f .cache/trend-input.md && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: curate trend
        id: curate
        if: steps.collect.outputs.ok == '1'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/.cache/trend-input.md and
            ${{ github.workspace }}/report-criteria/trend.md. Follow the
            criteria file: judge the month's industry trends and write to
            ${{ github.workspace }}/.cache/trend.md in the format it specifies.
            Also read ${{ github.workspace }}/landscape.yaml (the technology landscape) and the "landscape" section of
            ${{ github.workspace }}/interests.yaml (the reader's focus areas and the landscape items they follow) as background: use it to say why an entry matters to the reader, but never drop or
            down-rank an entry just because it is not on the landscape — new things matter most.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: curate trend (qwen fallback)
        if: steps.collect.outputs.ok == '1' && steps.curate.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/.cache/trend-input.md and
            ${{ github.workspace }}/report-criteria/trend.md. Follow the
            criteria file: judge the month's industry trends and write to
            ${{ github.workspace }}/.cache/trend.md in the format it specifies.
            Also read ${{ github.workspace }}/landscape.yaml (the technology landscape) and the "landscape" section of
            ${{ github.workspace }}/interests.yaml (the reader's focus areas and the landscape items they follow) as background: use it to say why an entry matters to the reader, but never drop or
            down-rank an entry just because it is not on the landscape — new things matter most.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"
      - name: render trend
        if: steps.collect.outputs.ok == '1'
        run: bun run src/digest/trend-render.ts
      - name: update landscape
        id: landscape
        if: steps.collect.outputs.ok == '1'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/report-criteria/landscape.md and the inputs it lists
            (${{ github.workspace }}/landscape.yaml, ${{ github.workspace }}/.cache/trend.md,
            ${{ github.workspace }}/source.yaml, ${{ github.workspace }}/interests.yaml). Follow the
            criteria file and write the proposed update to
            ${{ github.workspace }}/.cache/landscape-update.yaml in the format it specifies.
            Write only that one file. Do not edit landscape.yaml itself.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: update landscape (qwen fallback)
        if: steps.collect.outputs.ok == '1' && steps.landscape.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/report-criteria/landscape.md and the inputs it lists
            (${{ github.workspace }}/landscape.yaml, ${{ github.workspace }}/.cache/trend.md,
            ${{ github.workspace }}/source.yaml, ${{ github.workspace }}/interests.yaml). Follow the
            criteria file and write the proposed update to
            ${{ github.workspace }}/.cache/landscape-update.yaml in the format it specifies.
            Write only that one file. Do not edit landscape.yaml itself.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"
      - name: merge landscape
        if: steps.collect.outputs.ok == '1'
        run: bun run src/digest/landscape-update.ts

      - run: bun run src/site/build.ts

      - name: commit docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs landscape.yaml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trend: monthly update"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${GITHUB_REPOSITORY}" --label workflow-failure --state open \
            --search "\"workflow failure: ${{ github.workflow }}\" in:title" \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --repo "${GITHUB_REPOSITORY}" \
              --comment "後続の実行(${{ github.run_id }})が成功したため自動クローズします。"
          done

  notify-failure:
    needs: trend
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          EOF
          )"
