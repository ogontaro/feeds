name: timeline

# X ホームタイムラインは 1 回の取得で 88 件(平日日中は ~8 時間ぶん)しか返らないため、2 時間ごとに取得して
# actions/cache に直近 7 日ぶんを蓄積する(report.yml の x レポートが読む)。
# public リポジトリなので蓄積はコミットせず、ログにも件数しか出さない。
on:
  schedule:
    # 1 回遅延・失敗しても取りこぼさない間隔。毎時にすると cookie 経由の上流アクセスが増えアカウントロックの恐れ。
    - cron: "30 */2 * * *" # translate(0 */6)と30分ずらす
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: x-timeline
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      # key は毎回一意(キャッシュは上書きできない)。restore-keys の前方一致で最新の蓄積を拾う。
      - uses: actions/cache/restore@v4
        with:
          path: .cache/x-timeline.json
          key: x-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: x-timeline-

      # RSSHUB_ACCESS_KEY 未設定ならスクリプトが何もせず正常終了する。
      - run: bun run src/digest/x-timeline.ts --strict
        env:
          RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}

      # 一部のルートが失敗して異常終了しても、取得できた分は保存する(蓄積ファイルはキー設定時だけ作られる)。
      - if: always() && hashFiles('.cache/x-timeline.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/x-timeline.json
          key: x-timeline-${{ github.run_id }}-${{ github.run_attempt }}

      - name: close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${GITHUB_REPOSITORY}" --label workflow-failure --state open \
            --search "\"workflow failure: ${{ github.workflow }}\" in:title" \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --repo "${GITHUB_REPOSITORY}" \
              --comment "後続の実行(${{ github.run_id }})が成功したため自動クローズします。"
          done

  notify-failure:
    needs: poll
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          # cookie 切れ等で 2 時間ごとに失敗し続けても Issue を量産しない。
          open=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label workflow-failure --state open \
            --search "\"workflow failure: ${{ github.workflow }}\" in:title" --json number --jq length)
          [ "$open" != "0" ] && exit 0
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          EOF
          )"
