name: security

on:
  schedule:
    - cron: "17 */3 * * *" # 3時間ごと
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # 直列化で待たされた場合も、開始時点の最新 main から生成する
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      # 新規の Critical CVE / KEV / Kubernetes 公式アドバイザリを集める。
      # 処理済み ID は security-alerts.ndjson で除外される。
      - id: collect
        run: |
          bun run src/digest/security-collect.ts
          echo "n=$(jq '.items | length' .cache/security-input.json)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: triage
        id: triage
        if: steps.collect.outputs.n != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/.cache/security-input.md and
            ${{ github.workspace }}/report-criteria/security.md.
            Follow the criteria: judge the urgency of each item for the reader (a self-hosted
            Kubernetes operator), and write only ${{ github.workspace }}/.cache/security.json
            as the JSON array the criteria specifies. Omit items that do not need an alert.
            Do not invent versions, attack paths, or impact that are not in the input.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: triage (qwen fallback)
        if: steps.collect.outputs.n != '0' && steps.triage.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Read ${{ github.workspace }}/.cache/security-input.md and
            ${{ github.workspace }}/report-criteria/security.md.
            Follow the criteria: judge the urgency of each item for the reader (a self-hosted
            Kubernetes operator), and write only ${{ github.workspace }}/.cache/security.json
            as the JSON array the criteria specifies. Omit items that do not need an alert.
            Do not invent versions, attack paths, or impact that are not in the input.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"

      - name: render
        if: steps.collect.outputs.n != '0'
        run: bun run src/digest/security-render.ts

      - run: bun run src/site/build.ts

      - name: commit docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if [ -f security-alerts.ndjson ]; then git add security-alerts.ndjson; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "security: alert update"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${GITHUB_REPOSITORY}" --label workflow-failure --state open \
            --search "\"workflow failure: ${{ github.workflow }}\" in:title" \
            --json number --jq '.[].number' | while read -r n; do
            gh issue close "$n" --repo "${GITHUB_REPOSITORY}" \
              --comment "後続の実行(${{ github.run_id }})が成功したため自動クローズします。"
          done

  notify-failure:
    needs: security
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          EOF
          )"
