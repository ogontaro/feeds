name: report

on:
  schedule:
    - cron: "0 22 * * *" # 毎日 07:00 JST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: refresh translated feeds
        run: bun run src/translate.ts
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      # ---------------- claude ----------------
      - id: collect_claude
        run: |
          bun run src/report-collect.ts claude
          echo "n=$(jq length .cache/report-claude-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate claude
        id: curate_claude
        if: steps.collect_claude.outputs.n != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-claude-input.json,
            ${{ github.workspace }}/report-criteria/report-claude.md, and the "claude" section of
            ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the interests
            keywords to break ties: select the important entries and write the Japanese digest to
            ${{ github.workspace }}/.cache/report-claude.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: curate claude (qwen fallback)
        if: steps.collect_claude.outputs.n != '0' && steps.curate_claude.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-claude-input.json,
            ${{ github.workspace }}/report-criteria/report-claude.md, and the "claude" section of
            ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the interests
            keywords to break ties: select the important entries and write the Japanese digest to
            ${{ github.workspace }}/.cache/report-claude.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"
      - name: render claude
        if: steps.collect_claude.outputs.n != '0'
        run: bun run src/report-render.ts claude

      # ---------------- kubernetes ----------------
      - id: collect_kubernetes
        run: |
          bun run src/report-collect.ts kubernetes
          echo "n=$(jq length .cache/report-kubernetes-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate kubernetes
        id: curate_kubernetes
        if: steps.collect_kubernetes.outputs.n != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-kubernetes-input.json,
            ${{ github.workspace }}/report-criteria/report-kubernetes.md, and the "kubernetes"
            section of ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the
            interests keywords to break ties: select the important entries and write the Japanese
            digest to ${{ github.workspace }}/.cache/report-kubernetes.md in the format it
            specifies. Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: curate kubernetes (qwen fallback)
        if: steps.collect_kubernetes.outputs.n != '0' && steps.curate_kubernetes.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-kubernetes-input.json,
            ${{ github.workspace }}/report-criteria/report-kubernetes.md, and the "kubernetes"
            section of ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the
            interests keywords to break ties: select the important entries and write the Japanese
            digest to ${{ github.workspace }}/.cache/report-kubernetes.md in the format it
            specifies. Write only that one file.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"
      - name: render kubernetes
        if: steps.collect_kubernetes.outputs.n != '0'
        run: bun run src/report-render.ts kubernetes

      # ---------------- aws ----------------
      - id: collect_aws
        run: |
          bun run src/report-collect.ts aws
          echo "n=$(jq length .cache/report-aws-input.json)" >> "$GITHUB_OUTPUT"
      - name: curate aws
        id: curate_aws
        if: steps.collect_aws.outputs.n != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-aws-input.json,
            ${{ github.workspace }}/report-criteria/report-aws.md, and the "aws" section of
            ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the interests
            keywords to break ties: select the important entries and write the Japanese digest to
            ${{ github.workspace }}/.cache/report-aws.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model deepseek-v4.1-flash[1m]"
      - name: curate aws (qwen fallback)
        if: steps.collect_aws.outputs.n != '0' && steps.curate_aws.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.platform=github-actions,usage.api_endpoint=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            Read ${{ github.workspace }}/.cache/report-aws-input.json,
            ${{ github.workspace }}/report-criteria/report-aws.md, and the "aws" section of
            ${{ github.workspace }}/interests.yaml. Follow the criteria file, using the interests
            keywords to break ties: select the important entries and write the Japanese digest to
            ${{ github.workspace }}/.cache/report-aws.md in the format it specifies.
            Write only that one file.
          claude_args: "--allowedTools Read,Write --model qwen3.8-flash[1m]"
      - name: render aws
        if: steps.collect_aws.outputs.n != '0'
        run: bun run src/report-render.ts aws

      - run: bun run src/build.ts

      - name: commit docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs adoption-log.ndjson
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "report: daily update"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

  notify-failure:
    needs: report
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          EOF
          )"
