name: component-review-reminder

on:
  schedule:
    - cron: "0 0 1 * *" # 毎月1日 09:00 JST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "使用コンポーネントの棚卸し ($(date +%Y-%m))" \
            --label "component-review" \
            --body "$(cat <<'EOF'
          月次の棚卸しリマインダーです。以下を確認し、変更があれば `source.yaml` に反映してください。

          - 新しく使い始めたツール・サービスはないか（Kubernetes アドオン、AWS サービス、Claude 関連ツール等）
          - 使わなくなったコンポーネントはないか
          - よく見ているサイト・ブログで、まだ購読していないものはないか

          反映したら、このIssueをクローズしてください。
          EOF
          )"

  notify-failure:
    needs: remind
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "workflow-failure" --repo "${GITHUB_REPOSITORY}" \
            --color d73a4a --description "GitHub Actions workflow failure (auto-created)" 2>/dev/null || true
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "workflow failure: ${{ github.workflow }} ($(date +%Y-%m-%d))" \
            --label "workflow-failure" \
            --body "$(cat <<EOF
          ワークフロー \`${{ github.workflow }}\` が失敗しました。

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Trigger: ${{ github.event_name }}
          - Commit: ${{ github.sha }}
          EOF
          )"
