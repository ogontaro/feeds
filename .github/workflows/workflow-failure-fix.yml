name: workflow-failure-fix

# GITHUB_TOKENで作成したIssueは新しいワークフロー実行をトリガーしない（GitHub
# の再帰防止仕様）ため issues:opened は使わず、workflow_run で失敗を直接検知する。
on:
  workflow_run:
    workflows:
      - translate
      - report
      - release
      - feed-audit
      - issue-request
      - inoreader-sync
      - component-review-reminder
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: diagnose and fix with claude
        id: diagnose
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            The GitHub Actions workflow "${{ github.event.workflow_run.name }}" failed.
            Run: ${{ github.event.workflow_run.html_url }}

            Inspect why it failed, e.g.
            `gh run view ${{ github.event.workflow_run.id }} --log-failed`.

            If the failure is a transient upstream/API error (5xx, rate limit, model
            unavailable, empty model output, network timeout), do NOT change any file — this
            is not something a code change can fix. Only propose a change when the root cause
            is in this repository's own code or workflow definitions.

            If you find such a root cause and can fix it with a small, safe change to a
            workflow file under ${{ github.workspace }}/.github/workflows/ or a script under
            ${{ github.workspace }}/src/, make that change. Do not modify source.yaml or
            interests.yaml — those are unrelated to workflow failures. If you cannot determine
            a safe fix, do not change any file.
          claude_args: "--allowedTools Read,Write,Bash(gh run view:*)"

      - name: diagnose and fix with claude (qwen fallback)
        if: steps.diagnose.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_CUSTOM_HEADERS: "x-api-key: ${{ secrets.OPENCODE_API_KEY }}"
          OTEL_RESOURCE_ATTRIBUTES: usage.source=opencode
        with:
          anthropic_api_key: ${{ secrets.OPENCODE_API_KEY }}
          prompt: |
            The GitHub Actions workflow "${{ github.event.workflow_run.name }}" failed.
            Run: ${{ github.event.workflow_run.html_url }}

            Inspect why it failed, e.g.
            `gh run view ${{ github.event.workflow_run.id }} --log-failed`.

            If the failure is a transient upstream/API error (5xx, rate limit, model
            unavailable, empty model output, network timeout), do NOT change any file — this
            is not something a code change can fix. Only propose a change when the root cause
            is in this repository's own code or workflow definitions.

            If you find such a root cause and can fix it with a small, safe change to a
            workflow file under ${{ github.workspace }}/.github/workflows/ or a script under
            ${{ github.workspace }}/src/, make that change. Do not modify source.yaml or
            interests.yaml — those are unrelated to workflow failures. If you cannot determine
            a safe fix, do not change any file.
          claude_args: "--allowedTools Read,Write,Bash(gh run view:*) --model qwen3.8-flash[1m]"

      - name: open PR for review (no auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows src
          if git diff --cached --quiet; then echo "no fix produced"; exit 0; fi
          BRANCH="workflow-failure-fix/${{ github.event.workflow_run.id }}"
          git checkout -b "${BRANCH}"
          git commit -m "fix: address failure in ${{ github.event.workflow_run.name }} workflow"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          gh pr create --title "fix: ${{ github.event.workflow_run.name }} workflow failure" \
            --body "失敗したrun: ${{ github.event.workflow_run.html_url }}

          claude-code-action による自動診断・修正案です。**自動マージはしません。内容を確認してからマージしてください。**" \
            --base main --head "${BRANCH}"
