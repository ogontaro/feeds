name: feed-audit

on:
  schedule:
    - cron: "0 22 * * 6" # 毎週日曜 07:00 JST（report/release と曜日を分ける）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: docs-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      - name: collect stale candidates
        run: bun run src/feed-audit-collect.ts

      - name: audit feeds with claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read ${{ github.workspace }}/.cache/feed-audit-input.json (stale candidates),
            ${{ github.workspace }}/interests.yaml, and ${{ github.workspace }}/source.yaml.

            1. For each stale candidate that looks genuinely dead or off-topic for its domain's
               interests, set `enabled: false` on that feed entry in source.yaml (keep the entry,
               just disable it). Do not disable a feed only because interests.yaml doesn't
               mention it by name.
            2. For each domain, use WebSearch with a couple of that domain's `include` keywords
               from interests.yaml to find 1-2 new candidate RSS/Atom feed URLs not already
               present in source.yaml. Prefer official blogs, well-known engineering blogs, or
               topic/tag-scoped feeds — avoid a whole personal blog unless it is already
               tag-scoped to the topic.
            3. For each new candidate, fetch the URL and confirm it actually serves RSS/Atom XML
               before adding it. Append accepted candidates to source.yaml under the right
               domain/kind section with `addedAt: "<today, YYYY-MM-DD>"`.
            4. Write only source.yaml. Edit entries in place and keep existing YAML comments and
               structure intact — do not rewrite the whole file.
          claude_args: "--allowedTools Read,Write,WebSearch"

      - name: validate newly added feeds
        run: bun run src/feed-audit-validate.ts

      - name: open and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.yaml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          SUMMARY=$(bun run src/feed-audit-summarize.ts)
          BRANCH="feed-audit/$(date +%Y%m%d)"
          git checkout -b "${BRANCH}"
          git commit -m "chore: weekly feed audit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          PR_URL=$(gh pr create --title "chore: weekly feed audit ($(date +%Y-%m-%d))" \
            --body "自動生成: フィード監査の結果（バリデーション済みのみ）。

          ${SUMMARY}" \
            --base main --head "${BRANCH}")
          gh pr merge --auto --squash "${PR_URL}"
